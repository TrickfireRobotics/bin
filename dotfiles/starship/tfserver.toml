"$schema" = 'https://starship.rs/config-schema.json'

palette = "mocha"

format = """
[ tfserver ](bg:accent fg:crust bold)[](fg:accent bg:surface)$shell[](fg:surface) $directory$git_branch$git_status
$character"""

right_format = """$cmd_duration$bun$nodejs$golang$python$rust$ruby"""

add_newline = false

[palettes.mocha]
accent  = "#74c7ec" # sapphire
accent2 = "#b4befe" # lavender
surface = "#313244"
crust   = "#11111b"
text    = "#cdd6f4"
overlay = "#7f849c"
teal    = "#94e2d5"
peach   = "#fab387"
green   = "#a6e3a1"
red     = "#f38ba8"

[shell]
disabled           = false
zsh_indicator      = "zsh"
bash_indicator     = "bash"
unknown_indicator  = "shell"
style               = "bg:surface fg:accent2 bold"
format              = "[ $indicator ]($style)"

[directory]
style                     = "text bold"
truncation_length         = 4
fish_style_pwd_dir_length = 1
format                    = "[$path]($style)"
truncation_symbol         = "…/"

[git_branch]
style  = "teal"
symbol = " "
format = "[ $symbol$branch]($style)"

[git_status]
format     = "[$modified$ahead_behind](peach)"
modified   = " ·"
staged     = ""
ahead      = " ↑$count"
behind     = " ↓$count"
diverged   = " ↕"
conflicted = " ✗"
untracked  = ""
deleted    = ""
renamed    = ""
stashed    = ""
up_to_date = ""

[character]
success_symbol = "[❯](green bold)"
error_symbol   = "[❯](red bold)"

[cmd_duration]
min_time = 2000
format   = "[$duration ](overlay)"

[bun]
style          = "overlay"
symbol         = " "
format         = "[$symbol$version ]($style)"
version_format = "$raw"

[nodejs]
style          = "overlay"
symbol         = " "
format         = "[$symbol$version ]($style)"
version_format = "$raw"

[golang]
style          = "overlay"
symbol         = " "
format         = "[$symbol$version ]($style)"
version_format = "$raw"

[python]
style          = "overlay"
symbol         = " "
format         = "[$symbol$version ]($style)"
version_format = "$raw"

[rust]
style          = "overlay"
symbol         = " "
format         = "[$symbol$version ]($style)"
version_format = "$raw"

[ruby]
style          = "overlay"
symbol         = " "
format         = "[$symbol$version ]($style)"
version_format = "$raw"
