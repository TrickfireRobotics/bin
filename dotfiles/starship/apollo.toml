"$schema" = 'https://starship.rs/config-schema.json'

palette = "mocha"

format = """
[apollo](bg:accent fg:crust bold)[](fg:accent)$directory$git_branch$git_status$character"""

right_format = """$cmd_duration$bun$nodejs$golang$python$rust$ruby"""

add_newline = false

[palettes.mocha]
accent = "#fab387" # peach
crust = "#11111b"
text = "#cdd6f4"
dim = "#585b70"
green = "#a6e3a1"
red = "#f38ba8"

[directory]
style = "text bold"
truncation_length = 4
fish_style_pwd_dir_length = 1
format = " [$path]($style)"
truncation_symbol = "…/"

[git_branch]
style = "dim"
symbol = " "
format = "[ $symbol$branch]($style)"

[git_status]
format = "[$modified$ahead_behind](red)"
modified = " ·"
staged = ""
ahead = " ↑$count"
behind = " ↓$count"
diverged = " ↕"
conflicted = " ✗"
untracked = ""
deleted = ""
renamed = ""
stashed = ""
up_to_date = ""

[character]
success_symbol = "[ ❯](green)"
error_symbol = "[ ❯](red)"

[cmd_duration]
min_time = 2000
format = "[$duration ](dim)"

[bun]
style = "dim"
symbol = " "
format = "[$symbol$version ]($style)"
version_format = "$raw"

[nodejs]
style = "dim"
symbol = " "
format = "[$symbol$version ]($style)"
version_format = "$raw"

[golang]
style = "dim"
symbol = " "
format = "[$symbol$version ]($style)"
version_format = "$raw"

[python]
style = "dim"
symbol = " "
format = "[$symbol$version ]($style)"
version_format = "$raw"

[rust]
style = "dim"
symbol = " "
format = "[$symbol$version ]($style)"
version_format = "$raw"

[ruby]
style = "dim"
symbol = " "
format = "[$symbol$version ]($style)"
version_format = "$raw"
